    <text x="565" y="170" font-family="Helvetica" font-size="11px" text-anchor="middle" fill="#000000">result</text>

    <!-- Edge: NL2SQL Engine -> User (bottom, formatted answer) -->
    <path d="M 320 155 L 186.5 155" fill="none" stroke="#000000" stroke-width="1" stroke-miterlimit="10" pointer-events="stroke"/>
    <path d="M 181.25 155 L 188.25 151.5 L 186.5 155 L 188.25 158.5 Z" fill="#000000" stroke="#000000" stroke-width="1" stroke-miterlimit="10" pointer-events="all"/>
