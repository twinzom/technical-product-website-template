    <text x="250" y="170" font-family="Helvetica" font-size="11px" text-anchor="middle" fill="#000000">formatted answer</text>

    <!-- Edge: NL2SQL Engine -> LLM (down, prompt) -->
    <path d="M 380 170 L 380 202.5" fill="none" stroke="#000000" stroke-width="1" stroke-miterlimit="10" pointer-events="stroke"/>
