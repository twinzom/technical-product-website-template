    <text x="570" y="114" font-family="Helvetica" font-size="11px" text-anchor="middle" fill="#000000">SQL query</text>

    <!-- Edge: Database -> NL2SQL Engine (bottom, result) -->
    <path d="M 640 155 L 506.5 155" fill="none" stroke="#000000" stroke-width="1" stroke-miterlimit="10" pointer-events="stroke"/>
    <path d="M 501.25 155 L 508.25 151.5 L 506.5 155 L 508.25 158.5 Z" fill="#000000" stroke="#000000" stroke-width="1" stroke-miterlimit="10" pointer-events="all"/>
