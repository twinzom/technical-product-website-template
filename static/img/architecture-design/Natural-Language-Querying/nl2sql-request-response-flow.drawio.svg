<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="822px" height="292px" viewBox="-1 -1 822 292" content="&lt;mxfile&gt;&lt;diagram id=&quot;0&quot; name=&quot;F&quot;&gt;&lt;/diagram&gt;&lt;/mxfile&gt;">
  <defs/>
  <g>
    <!-- Edge: User -> NL2SQL Engine (top, question) -->
    <path d="M 180 125 L 313.5 125" fill="none" stroke="#000000" stroke-width="1" stroke-miterlimit="10" pointer-events="stroke"/>
    <path d="M 318.75 125 L 311.75 128.5 L 313.5 125 L 311.75 121.5 Z" fill="#000000" stroke="#000000" stroke-width="1" stroke-miterlimit="10" pointer-events="all"/>
